name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install gfortran (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Install gfortran (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc

      - name: Set up MSYS2 with gfortran (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-python

      - name: Build Advent Binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          python3 build.py

      - name: Build Advent Binary (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          python build.py --target windows

      - name: Test Execution (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          printf "YES\nWEST\n" | ./advent

      - name: Test Execution (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          printf "YES\nWEST\n" | ./advent.exe

      - name: Prepare Artifact Name
        shell: bash
        id: prep
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp advent advent-linux-amd64
            echo "binary=advent-linux-amd64" >> $GITHUB_OUTPUT
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp advent advent-macos-arm64
            echo "binary=advent-macos-arm64" >> $GITHUB_OUTPUT
          else
            cp advent.exe advent-windows-amd64.exe
            echo "binary=advent-windows-amd64.exe" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.binary }}
          path: ${{ steps.prep.outputs.binary }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            advent-linux-amd64/advent-linux-amd64
            advent-macos-arm64/advent-macos-arm64
            advent-windows-amd64.exe/advent-windows-amd64.exe
          generate_release_notes: true
